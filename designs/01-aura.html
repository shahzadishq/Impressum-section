<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressum Credit – 01 Aura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 48px 20px; background: #fff; font-family: "Lato", sans-serif; }

  /* ===== Design 01 – Aura ===== */
  .lm-aura {
    --lm-cyan: #18c8ec;
    --lm-teal: #2ee6c8;
    --lm-blue: #1e8ff0;
    position: relative;
    max-width: 880px;
    margin: 0 auto;
    padding: 2px;                      /* border thickness */
    border-radius: 22px;
    overflow: hidden;
    isolation: isolate;
  }
  /* rotating light that forms the border */
  .lm-aura::before {
    content: "";
    position: absolute;
    inset: -60%;
    z-index: -1;
    background: conic-gradient(from 0deg, transparent 0 55%, var(--lm-blue) 68%, var(--lm-cyan) 78%, var(--lm-teal) 86%, transparent 94%);
    animation: lm-aura-spin 7s linear infinite;
  }
  .lm-aura::after {                    /* faint static border so the card is framed everywhere */
    content: "";
    position: absolute; inset: 0; z-index: -2;
    border-radius: inherit;
    background: #2a2d31;
  }
  @keyframes lm-aura-spin { to { transform: rotate(1turn); } }

  .lm-aura__inner {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 28px;
    padding: 34px 36px;
    border-radius: 20px;
    background:
      radial-gradient(120% 140% at 0% 0%, rgba(24,200,236,.14), transparent 55%),
      #000;
    color: #fff;
  }
  .lm-aura__logo {
    width: 104px; height: 104px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(24,200,236,.18), transparent 70%);
  }
  .lm-aura__logo img { width: 86px; height: auto; display: block; animation: lm-aura-float 5s ease-in-out infinite; }
  @keyframes lm-aura-float { 50% { transform: translateY(-5px); } }

  .lm-aura__title { margin: 0 0 10px; font-size: 22px; font-weight: 900; letter-spacing: .01em; line-height: 1.25; }
  .lm-aura__text  { margin: 0; font-size: 16px; line-height: 1.6; color: rgba(255,255,255,.72); }
  .lm-aura__nowrap { white-space: nowrap; }
  .lm-aura__text strong { color: #fff; font-weight: 700; }

  .lm-aura__btn {
    position: relative;
    display: inline-flex; align-items: center; gap: 12px;
    padding: 16px 22px 16px 26px;
    border-radius: 999px;
    background: #fff; color: #000;
    font-weight: 700; font-size: 15px; text-decoration: none; white-space: nowrap;
    transition: background .3s, color .3s, box-shadow .3s;
  }
  .lm-aura__btn svg { width: 18px; height: 18px; transition: transform .3s; }
  .lm-aura__btn:hover { background: linear-gradient(90deg, var(--lm-blue), var(--lm-cyan)); color: #fff; box-shadow: 0 8px 30px rgba(24,200,236,.35); }
  .lm-aura__btn:hover svg { transform: translateX(4px); }
  .lm-aura__btn:focus-visible { outline: 3px solid var(--lm-cyan); outline-offset: 4px; }

  @media (max-width: 860px) {
    .lm-aura__nowrap { white-space: normal; }
    .lm-aura__inner { grid-template-columns: minmax(0,1fr); text-align: center; justify-items: center; gap: 22px; padding: 36px 26px; }
  }
  @media (max-width: 420px) { .lm-aura__btn { white-space: normal; text-align: left; } }
  @media (prefers-reduced-motion: reduce) {
    .lm-aura::before, .lm-aura__logo img { animation: none; }
  }
</style>
</head>
<body>

<section class="lm-aura" aria-label="Konzept, Design und Umsetzung">
  <div class="lm-aura__inner">
    <div class="lm-aura__logo">
      <img src="../assets/lm-logo.png" alt="Landsberger Medienagentur Logo">
    </div>
    <div>
      <h3 class="lm-aura__title">Konzept, Design und Umsetzung</h3>
      <p class="lm-aura__text"><span class="lm-aura__nowrap"><strong>Landsberger Medienagentur</strong> — Ioan Meyer</span><br>© 2026 Copyright</p>
    </div>
    <a class="lm-aura__btn" href="https://www.landsberger-medienagentur.de" target="_blank" rel="noopener">
      Website der Agentur besuchen
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
</section>

</body>
</html>
