<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressum Credit – 05 Signatur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 48px 20px; background: #fff; font-family: "Lato", sans-serif; }

  /* ===== Design 05 – Signatur ===== */
  .lm-sig {
    --lm-cyan: #18c8ec;
    --lm-teal: #2ee6c8;
    --lm-blue: #1e8ff0;
    --lm-ink: #1b1d20;
    max-width: 620px;
    margin: 0 auto;
    padding: 20px 20px 8px;
    text-align: center;
    color: var(--lm-ink);
  }
  /* logo "writes" itself from left to right, like a signature */
  .lm-sig__logo {
    display: block; width: 132px; height: auto; margin: 0 auto 22px;
    clip-path: inset(0 100% 0 0);
  }
  .lm-sig.is-visible .lm-sig__logo { animation: lm-sig-write 1.6s cubic-bezier(.7,0,.3,1) forwards; }
  @keyframes lm-sig-write { to { clip-path: inset(0 0 0 0); } }

  .lm-sig__title { margin: 0 0 18px; font-size: 26px; font-weight: 300; line-height: 1.3; letter-spacing: .01em; }
  .lm-sig__title b { font-weight: 900; }

  /* line that draws out from the centre after the logo */
  .lm-sig__rule {
    width: 160px; height: 2px; margin: 0 auto 18px; border: 0;
    background: linear-gradient(90deg, transparent, var(--lm-blue), var(--lm-cyan), var(--lm-teal), transparent);
    transform: scaleX(0);
  }
  .lm-sig.is-visible .lm-sig__rule { animation: lm-sig-rule .9s 1.3s ease-out forwards; }
  @keyframes lm-sig-rule { to { transform: scaleX(1); } }

  .lm-sig__text { margin: 0 0 28px; font-size: 16px; line-height: 1.7; color: #50565d; letter-spacing: .03em; }

  .lm-sig__btn {
    position: relative;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 2px;
    color: var(--lm-ink); font-weight: 700; font-size: 16px; text-decoration: none;
  }
  .lm-sig__btn::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, var(--lm-blue), var(--lm-cyan), var(--lm-teal));
    transform: scaleX(.35); transform-origin: left; transition: transform .45s cubic-bezier(.65,0,.35,1);
  }
  .lm-sig__btn:hover::after { transform: scaleX(1); }
  .lm-sig__btn .lm-sig__circle {
    width: 34px; height: 34px; display: grid; place-items: center;
    border-radius: 50%; background: var(--lm-ink); color: #fff;
    transition: background .3s, transform .3s;
  }
  .lm-sig__btn:hover .lm-sig__circle { background: var(--lm-cyan); transform: rotate(-45deg); }
  .lm-sig__btn svg { width: 15px; height: 15px; }
  .lm-sig__btn:focus-visible { outline: 3px solid var(--lm-cyan); outline-offset: 4px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .lm-sig__logo { clip-path: none; animation: none !important; }
    .lm-sig__rule { transform: none; animation: none !important; }
  }
</style>
</head>
<body>

<section class="lm-sig" aria-label="Konzept, Design und Umsetzung">
  <img class="lm-sig__logo" src="../assets/lm-logo.png" alt="Landsberger Medienagentur Logo">
  <h3 class="lm-sig__title"><b>Konzept, Design</b> und <b>Umsetzung</b></h3>
  <hr class="lm-sig__rule">
  <p class="lm-sig__text">Landsberger Medienagentur — Ioan Meyer<br>© 2026 Copyright</p>
  <a class="lm-sig__btn" href="https://www.landsberger-medienagentur.de" target="_blank" rel="noopener">
    Website der Agentur besuchen
    <span class="lm-sig__circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  </a>
</section>

<script>
(function () {
  var el = document.querySelector('.lm-sig');
  if (!el) return;
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries, obs) {
      entries.forEach(function (en) { if (en.isIntersecting) { el.classList.add('is-visible'); obs.disconnect(); } });
    }, { threshold: 0.4 }).observe(el);
  } else { el.classList.add('is-visible'); }
})();
</script>

</body>
</html>
