<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressum Credit – 06 Glas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 48px 20px; background: #fff; font-family: "Lato", sans-serif; }

  /* ===== Design 06 – Glas ===== */
  .lm-glas {
    --lm-cyan: #18c8ec;
    --lm-teal: #2ee6c8;
    --lm-blue: #1e8ff0;
    --lm-ink: #1b1d20;
    position: relative;
    max-width: 880px;
    margin: 0 auto;
    padding: 34px;
    border-radius: 26px;
    overflow: hidden;
    isolation: isolate;
    background: #eef6f9;
  }
  /* soft colour blobs drifting behind the glass */
  .lm-glas__blob { position: absolute; z-index: -1; border-radius: 50%; filter: blur(40px); opacity: .75; }
  .lm-glas__blob--1 { width: 300px; height: 300px; left: -60px; top: -90px; background: var(--lm-cyan); animation: lm-glas-a 16s ease-in-out infinite alternate; }
  .lm-glas__blob--2 { width: 260px; height: 260px; right: -40px; bottom: -110px; background: var(--lm-teal); animation: lm-glas-b 19s ease-in-out infinite alternate; }
  .lm-glas__blob--3 { width: 200px; height: 200px; left: 45%; top: 30%; background: var(--lm-blue); opacity: .45; animation: lm-glas-a 23s ease-in-out infinite alternate-reverse; }
  @keyframes lm-glas-a { to { transform: translate(140px, 60px) scale(1.15); } }
  @keyframes lm-glas-b { to { transform: translate(-160px, -40px) scale(.9); } }

  .lm-glas__card {
    display: grid;
    grid-template-columns: auto minmax(0,1fr) auto;
    align-items: center;
    gap: 30px;
    padding: 30px 34px;
    border-radius: 18px;
    background: rgba(255,255,255,.58);
    border: 1px solid rgba(255,255,255,.85);
    box-shadow: 0 20px 50px -30px rgba(10,70,110,.5);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
  }
  .lm-glas__logo { width: 92px; height: auto; display: block; }
  .lm-glas__title { margin: 0 0 8px; font-size: 22px; font-weight: 900; color: var(--lm-ink); line-height: 1.25; }
  .lm-glas__text { margin: 0; font-size: 16px; line-height: 1.6; color: #3c4248; letter-spacing: .02em; }

  .lm-glas__btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 15px 26px;
    border-radius: 14px;
    background: var(--lm-ink); color: #fff;
    font-weight: 700; font-size: 15px; text-decoration: none; white-space: nowrap;
    box-shadow: 0 10px 24px -12px rgba(0,0,0,.6);
    transition: transform .25s, box-shadow .25s, background .25s;
  }
  .lm-glas__btn:hover { transform: translateY(-2px); background: #000; box-shadow: 0 16px 30px -12px rgba(24,200,236,.7); }
  .lm-glas__btn svg { width: 16px; height: 16px; }
  .lm-glas__btn:focus-visible { outline: 3px solid var(--lm-blue); outline-offset: 3px; }

  @media (max-width: 760px) {
    .lm-glas { padding: 18px; }
    .lm-glas__card { grid-template-columns: minmax(0,1fr); justify-items: center; text-align: center; gap: 18px; padding: 30px 22px; }
    .lm-glas__btn { white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) { .lm-glas__blob { animation: none; } }
</style>
</head>
<body>

<section class="lm-glas" aria-label="Konzept, Design und Umsetzung">
  <span class="lm-glas__blob lm-glas__blob--1" aria-hidden="true"></span>
  <span class="lm-glas__blob lm-glas__blob--2" aria-hidden="true"></span>
  <span class="lm-glas__blob lm-glas__blob--3" aria-hidden="true"></span>
  <div class="lm-glas__card">
    <img class="lm-glas__logo" src="../assets/lm-logo.png" alt="Landsberger Medienagentur Logo">
    <div>
      <h3 class="lm-glas__title">Konzept, Design und Umsetzung</h3>
      <p class="lm-glas__text">Landsberger Medienagentur — Ioan Meyer<br>© 2026 Copyright</p>
    </div>
    <a class="lm-glas__btn" href="https://www.landsberger-medienagentur.de" target="_blank" rel="noopener">
      Website der Agentur besuchen
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
</section>

</body>
</html>
