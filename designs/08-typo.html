<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressum Credit – 08 Typo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 48px 20px; background: #fff; font-family: "Lato", sans-serif; }

  /* ===== Design 08 – Typo ===== */
  .lm-typo {
    --lm-cyan: #18c8ec;
    --lm-teal: #2ee6c8;
    --lm-blue: #1e8ff0;
    --lm-ink: #1b1d20;
    max-width: 900px;
    margin: 0 auto;
    padding: 10px 0;
  }
  /* the three words are the design; a colour wave travels slowly through them */
  .lm-typo__title {
    margin: 0;
    font-size: clamp(40px, 7.4vw, 76px);
    font-weight: 900;
    line-height: .98;
    letter-spacing: -.02em;
    background: linear-gradient(100deg, var(--lm-ink) 0 38%, var(--lm-blue) 46%, var(--lm-cyan) 52%, var(--lm-teal) 57%, var(--lm-ink) 66% 100%);
    background-size: 260% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: lm-typo-wave 9s ease-in-out infinite;
  }
  .lm-typo__title span { display: block; }
  .lm-typo__title .lm-typo__und { font-weight: 400; font-size: .5em; letter-spacing: 0; }
  @keyframes lm-typo-wave { 0% { background-position: 100% 0; } 60%, 100% { background-position: 0 0; } }

  .lm-typo__foot {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 22px;
    margin-top: 30px; padding-top: 24px;
    border-top: 2px solid var(--lm-ink);
  }
  .lm-typo__who { display: flex; align-items: center; gap: 18px; }
  .lm-typo__who img { width: 70px; height: auto; display: block; }
  .lm-typo__who p { margin: 0; font-size: 16px; line-height: 1.55; color: #3f444a; letter-spacing: .02em; }
  .lm-typo__who strong { color: var(--lm-ink); }

  .lm-typo__btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 26px;
    background: var(--lm-ink); color: #fff;
    font-weight: 700; font-size: 15px; text-decoration: none;
    border-radius: 4px;
    box-shadow: 5px 5px 0 var(--lm-cyan);
    transition: transform .2s, box-shadow .2s;
  }
  .lm-typo__btn:hover { transform: translate(-2px,-2px); box-shadow: 8px 8px 0 var(--lm-cyan); }
  .lm-typo__btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--lm-cyan); }
  .lm-typo__btn svg { width: 16px; height: 16px; }
  .lm-typo__btn:focus-visible { outline: 3px solid var(--lm-blue); outline-offset: 4px; }

  @media (max-width: 560px) {
    .lm-typo__who { flex-direction: column; align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lm-typo__title { animation: none; background-position: 0 0; }
  }
</style>
</head>
<body>

<section class="lm-typo" aria-label="Konzept, Design und Umsetzung">
  <h3 class="lm-typo__title">
    <span>Konzept, Design</span>
    <span><span class="lm-typo__und">und</span> Umsetzung</span>
  </h3>
  <div class="lm-typo__foot">
    <div class="lm-typo__who">
      <img src="../assets/lm-logo.png" alt="Landsberger Medienagentur Logo">
      <p><strong>Landsberger Medienagentur</strong> — Ioan Meyer<br>© 2026 Copyright</p>
    </div>
    <a class="lm-typo__btn" href="https://www.landsberger-medienagentur.de" target="_blank" rel="noopener">
      Website der Agentur besuchen
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>
    </a>
  </div>
</section>

</body>
</html>
