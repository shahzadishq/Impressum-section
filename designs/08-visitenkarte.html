<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressum Credit – 08 Visitenkarte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 48px 20px; background: #fff; font-family: "Lato", sans-serif; }

  /* ===== Design 08 – Visitenkarte ===== */
  .lm-card {
    --lm-cyan: #18c8ec;
    --lm-teal: #2ee6c8;
    --lm-blue: #1e8ff0;
    --lm-ink: #1b1d20;
    max-width: 880px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 440px) minmax(0, 1fr);
    gap: 48px;
    align-items: center;
  }

  /* the business card */
  .lm-card__stage { perspective: 900px; }
  .lm-card__biz {
    --rx: 0deg; --ry: 0deg; --gx: 50%; --gy: 50%;
    position: relative;
    aspect-ratio: 85 / 55;                 /* real business-card proportions */
    border-radius: 14px;
    padding: 26px 28px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: #1b1d20;
    color: #fff;
    overflow: hidden;
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s;
    box-shadow: 0 30px 50px -30px rgba(0,0,0,.55), 0 12px 20px -14px rgba(0,0,0,.35);
  }
  .lm-card__biz.is-tracking { transition: transform .08s linear, box-shadow .5s; }
  /* gradient edge on the left like a printed colour stripe */
  .lm-card__biz::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
    background: linear-gradient(180deg, var(--lm-blue), var(--lm-cyan), var(--lm-teal));
  }
  /* glossy light that follows the pointer */
  .lm-card__biz::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(260px circle at var(--gx) var(--gy), rgba(255,255,255,.16), transparent 60%);
    opacity: 0; transition: opacity .4s;
  }
  .lm-card__biz:hover::after { opacity: 1; }

  /* entrance: the card turns in once when it scrolls into view */
  .lm-card__biz { opacity: 0; transform: rotateY(-28deg) rotateX(8deg) translateY(14px); }
  .lm-card.is-visible .lm-card__biz { opacity: 1; transform: rotateX(var(--rx)) rotateY(var(--ry)); transition: transform 1s cubic-bezier(.2,.8,.2,1), opacity .6s; }
  .lm-card.is-visible .lm-card__biz.is-tracking { transition: transform .08s linear; }

  .lm-card__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .lm-card__logo { width: 92px; height: auto; display: block; }
  .lm-card__year { font-size: 13px; color: rgba(255,255,255,.55); letter-spacing: .04em; }
  .lm-card__name { margin: 0 0 4px; font-size: 19px; font-weight: 900; letter-spacing: .01em; }
  .lm-card__person { margin: 0; font-size: 15px; color: rgba(255,255,255,.7); letter-spacing: .03em; }

  /* text next to the card */
  .lm-card__title { margin: 0 0 12px; font-size: 26px; font-weight: 900; color: var(--lm-ink); line-height: 1.2; }
  .lm-card__text { margin: 0 0 24px; font-size: 16px; line-height: 1.6; color: #50565d; letter-spacing: .02em; }

  .lm-card__btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 15px 26px;
    border-radius: 8px;
    background: var(--lm-ink); color: #fff;
    font-weight: 700; font-size: 15px; text-decoration: none;
    transition: background .25s, transform .25s;
  }
  .lm-card__btn:hover { background: linear-gradient(90deg, var(--lm-blue), var(--lm-cyan)); transform: translateY(-2px); }
  .lm-card__btn svg { width: 16px; height: 16px; transition: transform .25s; }
  .lm-card__btn:hover svg { transform: translateX(3px); }
  .lm-card__btn:focus-visible { outline: 3px solid var(--lm-cyan); outline-offset: 3px; }

  @media (max-width: 760px) {
    .lm-card { grid-template-columns: minmax(0,1fr); gap: 28px; text-align: center; }
    .lm-card__stage { max-width: 380px; width: 100%; margin: 0 auto; }
    .lm-card__biz { text-align: left; padding: 20px 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lm-card__biz, .lm-card.is-visible .lm-card__biz { opacity: 1; transform: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<section class="lm-card" aria-label="Konzept, Design und Umsetzung">
  <div class="lm-card__stage">
    <div class="lm-card__biz">
      <div class="lm-card__top">
        <img class="lm-card__logo" src="../assets/lm-logo.png" alt="Landsberger Medienagentur Logo">
        <span class="lm-card__year">© 2026</span>
      </div>
      <div>
        <p class="lm-card__name">Landsberger Medienagentur</p>
        <p class="lm-card__person">Ioan Meyer</p>
      </div>
    </div>
  </div>

  <div>
    <h3 class="lm-card__title">Konzept, Design und Umsetzung</h3>
    <p class="lm-card__text">Landsberger Medienagentur — Ioan Meyer<br>© 2026 Copyright</p>
    <a class="lm-card__btn" href="https://www.landsberger-medienagentur.de" target="_blank" rel="noopener">
      Website der Agentur besuchen
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
</section>

<script>
(function () {
  var root = document.querySelector('.lm-card');
  if (!root) return;
  var card = root.querySelector('.lm-card__biz');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // turn the card in once it is visible
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries, obs) {
      entries.forEach(function (en) { if (en.isIntersecting) { root.classList.add('is-visible'); obs.disconnect(); } });
    }, { threshold: 0.35 }).observe(root);
  } else { root.classList.add('is-visible'); }

  if (reduce) return;
  // tilt + gloss follow the pointer
  card.addEventListener('pointermove', function (e) {
    var r = card.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    card.classList.add('is-tracking');
    card.style.setProperty('--ry', ((x - .5) * 14).toFixed(2) + 'deg');
    card.style.setProperty('--rx', ((.5 - y) * 12).toFixed(2) + 'deg');
    card.style.setProperty('--gx', (x * 100) + '%');
    card.style.setProperty('--gy', (y * 100) + '%');
  });
  card.addEventListener('pointerleave', function () {
    card.classList.remove('is-tracking');
    card.style.setProperty('--rx', '0deg');
    card.style.setProperty('--ry', '0deg');
  });
})();
</script>

</body>
</html>
