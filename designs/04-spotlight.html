<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressum Credit – 04 Spotlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 48px 20px; background: #fff; font-family: "Lato", sans-serif; }

  /* ===== Design 04 – Spotlight ===== */
  .lm-spot {
    --lm-cyan: #18c8ec;
    --lm-teal: #2ee6c8;
    --lm-blue: #1e8ff0;
    --lm-ink: #1b1d20;
    --mx: 22%; --my: 40%;
    position: relative;
    max-width: 880px;
    margin: 0 auto;
    padding: 44px 48px;
    border-radius: 18px;
    border: 1px solid #e3e7eb;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(380px circle at var(--mx) var(--my), rgba(24,200,236,.16), transparent 70%),
      radial-gradient(#d5dbe1 1px, transparent 1px) 0 0 / 18px 18px,
      #f7f9fa;
  }
  .lm-spot__grid {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 32px;
    align-items: center;
  }
  .lm-spot__logo { width: 96px; height: auto; display: block; }

  .lm-spot__steps { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; padding: 0; list-style: none; }
  .lm-spot__steps li {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid #d6dce2;
    background: #fff;
    font-size: 14px; font-weight: 700; color: #6a7078;
    transition: color .5s, border-color .5s, background .5s, box-shadow .5s;
  }
  /* the three steps light up one after another once the section is visible */
  .lm-spot.is-visible .lm-spot__steps li { color: #fff; border-color: transparent; background: linear-gradient(90deg, var(--lm-blue), var(--lm-cyan)); box-shadow: 0 6px 16px -8px rgba(24,200,236,.8); }
  .lm-spot.is-visible .lm-spot__steps li:nth-child(1) { transition-delay: .2s; }
  .lm-spot.is-visible .lm-spot__steps li:nth-child(2) { transition-delay: .65s; }
  .lm-spot.is-visible .lm-spot__steps li:nth-child(3) { transition-delay: 1.1s; }

  .lm-spot__text { margin: 0; font-size: 16px; line-height: 1.6; color: #3f444a; letter-spacing: .02em; }
  .lm-spot__text strong { color: var(--lm-ink); }

  .lm-spot__btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 15px 24px;
    border-radius: 10px;
    border: 2px solid var(--lm-ink);
    background: transparent; color: var(--lm-ink);
    font-weight: 700; font-size: 15px; text-decoration: none; white-space: nowrap;
    transition: background .25s, color .25s, transform .25s;
  }
  .lm-spot__btn:hover { background: var(--lm-ink); color: #fff; transform: translateY(-2px); }
  .lm-spot__btn svg { width: 16px; height: 16px; }
  .lm-spot__btn:focus-visible { outline: 3px solid var(--lm-cyan); outline-offset: 3px; }

  .lm-spot__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (max-width: 760px) {
    .lm-spot { padding: 34px 24px; }
    .lm-spot__grid { grid-template-columns: minmax(0,1fr); justify-items: center; text-align: center; gap: 20px; }
    .lm-spot__steps { justify-content: center; }
    .lm-spot__btn { white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lm-spot__steps li { transition: none !important; }
  }
</style>
</head>
<body>

<section class="lm-spot" aria-label="Konzept, Design und Umsetzung">
  <div class="lm-spot__grid">
    <img class="lm-spot__logo" src="../assets/lm-logo.png" alt="Landsberger Medienagentur Logo">
    <div>
      <h3 class="lm-spot__sr">Konzept, Design und Umsetzung</h3>
      <ul class="lm-spot__steps" aria-hidden="true">
        <li>Konzept</li><li>Design</li><li>Umsetzung</li>
      </ul>
      <p class="lm-spot__text"><strong>Landsberger Medienagentur</strong> — Ioan Meyer<br>© 2026 Copyright</p>
    </div>
    <a class="lm-spot__btn" href="https://www.landsberger-medienagentur.de" target="_blank" rel="noopener">
      Website der Agentur besuchen
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
</section>

<script>
(function () {
  var el = document.querySelector('.lm-spot');
  if (!el) return;
  // glow follows the cursor
  el.addEventListener('pointermove', function (e) {
    var r = el.getBoundingClientRect();
    el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    el.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
  // light up the three steps when scrolled into view
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries, obs) {
      entries.forEach(function (en) { if (en.isIntersecting) { el.classList.add('is-visible'); obs.disconnect(); } });
    }, { threshold: 0.4 }).observe(el);
  } else { el.classList.add('is-visible'); }
})();
</script>

</body>
</html>
